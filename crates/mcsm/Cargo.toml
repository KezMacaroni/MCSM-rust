[package]
name = "mcsm"
description = "Minecraft: Story Mode on Bevy, running from the user's own install"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ttarch.workspace = true
ttmeta.workspace = true
bevy = { workspace = true, features = ["mp3"] }
fsbex = "0.3"
rfd = "0.17"
thiserror.workspace = true
mlua = { version = "0.11", features = ["lua52", "vendored", "send"] }
