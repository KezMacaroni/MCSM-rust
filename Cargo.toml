[workspace]
resolver = "3"
members = ["crates/ttarch", "crates/ttmeta", "crates/mcsm-tools", "crates/mcsm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/KezMacaroni/MCSM-rust"
rust-version = "1.95"

[workspace.dependencies]
ttarch = { path = "crates/ttarch" }
ttmeta = { path = "crates/ttmeta" }
flate2 = "1"
thiserror = "2"
bevy = "0.19.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Shipped builds: no debug symbols. (Build-machine paths are also remapped by the release
# script's RUSTFLAGS so they never end up in the exe.)
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
codegen-units = 1
